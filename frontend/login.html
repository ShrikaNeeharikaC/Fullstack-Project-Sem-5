<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — BugOps</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ===== Navbar ===== -->
<header class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#241a49" stroke-width="3" stroke-linecap="round">
          <line x1="20" y1="4" x2="20" y2="36"/>
          <line x1="4" y1="20" x2="36" y2="20"/>
          <line x1="8" y1="8" x2="32" y2="32"/>
          <line x1="32" y1="8" x2="8" y2="32"/>
        </g>
        <circle cx="20" cy="20" r="3.5" fill="#241a49"/>
      </svg>
      BugOps
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="#about">About Us</a>
    </nav>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-dark btn-sm">Login</a>
      <a href="signup.html" class="btn btn-dark btn-sm">SignUp</a>
    </div>
    <button class="nav-toggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- ===== Login ===== -->
<section class="auth-wrap">
  <div class="auth-card">

    <div id="login-form-view">
      <a href="index.html" class="logo">
        <svg class="logo-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#241a49" stroke-width="3" stroke-linecap="round">
            <line x1="20" y1="4" x2="20" y2="36"/>
            <line x1="4" y1="20" x2="36" y2="20"/>
            <line x1="8" y1="8" x2="32" y2="32"/>
            <line x1="32" y1="8" x2="8" y2="32"/>
          </g>
          <circle cx="20" cy="20" r="3.5" fill="#241a49"/>
        </svg>
        BugOps
      </a>
      <h1>Welcome back</h1>
      <p class="auth-subtext">Log in to see your scans and bug reports.</p>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" placeholder="you@company.com" autocomplete="email" />
          <span class="field-error" id="email-error"></span>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" placeholder="Enter your password" autocomplete="current-password" />
          <span class="field-error" id="password-error"></span>
        </div>
        <div class="form-row-between">
          <label class="checkbox-row">
            <input type="checkbox" id="remember-me" />
            Remember me
          </label>
          <a href="#forgot-password" class="forgot-link">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-dark btn-block">Log In</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>

    <div id="login-success-view" class="auth-success">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/></svg>
      <h2>Logged in</h2>
      <p>Taking you to your dashboard&hellip;</p>
    </div>

  </div>
</section>

<script src="js/auth.js"></script>

<script src="js/main.js"></script>
<script src="js/login.js"></script>
</body>
</html>
