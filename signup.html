<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — BugOps</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ===== Navbar ===== -->
<header class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#241a49" stroke-width="3" stroke-linecap="round">
          <line x1="20" y1="4" x2="20" y2="36"/>
          <line x1="4" y1="20" x2="36" y2="20"/>
          <line x1="8" y1="8" x2="32" y2="32"/>
          <line x1="32" y1="8" x2="8" y2="32"/>
        </g>
        <circle cx="20" cy="20" r="3.5" fill="#241a49"/>
      </svg>
      BugOps
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="#about">About Us</a>
    </nav>
    <div class="nav-actions">
      <a href="login.html" class="btn btn-dark btn-sm">Login</a>
      <a href="signup.html" class="btn btn-dark btn-sm">SignUp</a>
    </div>
    <button class="nav-toggle" aria-label="Toggle navigation">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- ===== Sign Up ===== -->
<section class="auth-wrap">
  <div class="auth-card">

    <div id="signup-form-view">
      <a href="index.html" class="logo">
        <svg class="logo-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#241a49" stroke-width="3" stroke-linecap="round">
            <line x1="20" y1="4" x2="20" y2="36"/>
            <line x1="4" y1="20" x2="36" y2="20"/>
            <line x1="8" y1="8" x2="32" y2="32"/>
            <line x1="32" y1="8" x2="8" y2="32"/>
          </g>
          <circle cx="20" cy="20" r="3.5" fill="#241a49"/>
        </svg>
        BugOps
      </a>
      <h1>Create your account</h1>
      <p class="auth-subtext">Start scanning your app for bugs in under a minute.</p>

      <form id="signup-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="signup-name">Full name</label>
          <input type="text" id="signup-name" name="name" placeholder="Jane Doe" autocomplete="name" />
          <span class="field-error" id="name-error"></span>
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" name="email" placeholder="you@company.com" autocomplete="email" />
          <span class="field-error" id="email-error"></span>
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" placeholder="Create a password" autocomplete="new-password" />
          <span class="field-error" id="password-error"></span>
        </div>
        <div class="form-group">
          <label for="signup-confirm-password">Confirm password</label>
          <input type="password" id="signup-confirm-password" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" />
          <span class="field-error" id="confirm-password-error"></span>
        </div>
        <div class="form-group">
          <label class="checkbox-row">
            <input type="checkbox" id="agree-terms" />
            I agree to the <a href="#terms" class="forgot-link">Terms of Service</a> and <a href="#privacy" class="forgot-link">Privacy Policy</a>
          </label>
          <span class="field-error" id="terms-error"></span>
        </div>
        <button type="submit" class="btn btn-dark btn-block">Create Account</button>
      </form>

      <div class="auth-divider">or continue with</div>
      <div class="social-row">
        <button type="button" class="btn btn-social btn-block" id="google-signup">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.53 5.53 0 0 1-2.4 3.63v3h3.87c2.27-2.09 3.58-5.17 3.58-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.87-3c-1.08.72-2.46 1.15-4.08 1.15-3.14 0-5.8-2.12-6.75-4.96H1.26v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.25 14.28A7.2 7.2 0 0 1 4.87 12c0-.79.14-1.56.38-2.28v-3.1H1.26A12 12 0 0 0 0 12c0 1.94.46 3.77 1.26 5.38z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.26 6.62l3.99 3.1C6.2 6.87 8.86 4.75 12 4.75z"/></svg>
          Continue with Google
        </button>
      </div>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>

    <div id="signup-success-view" class="auth-success">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/></svg>
      <h2>Account created</h2>
      <p>Taking you to your dashboard&hellip;</p>
    </div>

  </div>
</section>

<script src="js/main.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
